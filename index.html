<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monitoreo HQ Montemorelos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Página pública de solo lectura: encabezado con logo, indicadores, pestañas Hoy / Semana / Equipo / Secciones */
:root{
  --bg:#f3f1ee; --panel:#fff; --ink:#1d1b19; --muted:#6c655e; --line:#e2ddd6;
  --accent:#ff8200; --accent-ink:#b85a00; --accent-soft:#fff0e0;
  --ok:#1f8a4c; --ok-soft:#e3f4ea; --warn:#b7791f; --warn-soft:#fbf1dc;
  --bad:#c0392b; --bad-soft:#fbe6e3; --run:#1f6fb2; --run-soft:#e2eefa; --off:#8a837b; --off-soft:#efece8;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#151311; --panel:#1f1c19; --ink:#f1ece6; --muted:#a79f96; --line:#332e29;
  --accent:#ff8f1f; --accent-ink:#ffb366; --accent-soft:#3a2511;
  --ok:#4cc27e; --ok-soft:#173223; --warn:#e3a94b; --warn-soft:#3a2d15;
  --bad:#ef6b5c; --bad-soft:#3d1c18; --run:#64a8e6; --run-soft:#15283b; --off:#8f877e; --off-soft:#2a2622;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) 40px;display:grid;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-bottom:3px solid var(--accent);padding-bottom:12px}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:58px;width:auto;max-width:38vw;display:block}
.brand h1{font-family:var(--f-display);font-weight:600;font-size:1.5rem;margin:0;letter-spacing:.03em;text-transform:uppercase;line-height:1.1}
.brand small{color:var(--muted);font-size:.85rem}
.status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.dot{display:inline-flex;align-items:center;gap:6px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.74rem;padding:4px 10px;border-radius:99px;background:var(--off-soft);color:var(--off)}
.dot i{width:8px;height:8px;border-radius:50%;background:currentColor}
.dot.on{background:var(--ok-soft);color:var(--ok)}
.dot.demo{background:var(--warn-soft);color:var(--warn)}
.banner{border-radius:8px;padding:10px 14px;font-size:.9rem;background:var(--warn-soft)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px;overflow-x:auto;max-width:100%}
.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:99px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.nav{display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 11px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.navlabel{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.04em;min-width:10ch;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.kpi b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi.alert b{color:var(--bad)}
.meter{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:last-child{grid-column:span 2}}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 8px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.04em;margin:0}
.sec-h small{color:var(--muted)}
.timeline{display:grid;gap:8px}
.act{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--off);border-radius:var(--r);padding:12px 14px}
.act[data-s="en_curso"]{border-left-color:var(--run)} .act[data-s="completada"]{border-left-color:var(--ok)}
.act[data-s="incidencia"]{border-left-color:var(--bad)} .act[data-s="cancelada"]{opacity:.6} .act.late{border-left-color:var(--warn)}
.time{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:.95rem}
.time small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.act h3{margin:0;font-size:1.05rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.meta{color:var(--muted);font-size:.86rem;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;align-items:center}
.pill{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--off-soft);color:var(--off);white-space:nowrap}
.pill[data-s="en_curso"]{background:var(--run-soft);color:var(--run)} .pill[data-s="completada"]{background:var(--ok-soft);color:var(--ok)}
.pill[data-s="incidencia"]{background:var(--bad-soft);color:var(--bad)} .pill.late{background:var(--warn-soft);color:var(--warn)}
.tag{font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:5px;background:var(--accent-soft);color:var(--accent-ink);text-transform:uppercase;letter-spacing:.05em}
.tag.sec{background:var(--ink);color:var(--bg)}
.prog{display:flex;align-items:center;gap:8px;margin-top:8px}
.prog .meter{flex:1;margin:0;height:8px;max-width:320px}
.prog output{font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.note{margin-top:6px;font-size:.88rem;background:var(--bg);border-radius:6px;padding:6px 9px}
.note.bad{background:var(--bad-soft)}
.now-line{display:flex;align-items:center;gap:8px;color:var(--accent-ink);font-family:var(--f-mono);font-size:.78rem;font-weight:600}
.now-line::after{content:"";flex:1;height:2px;background:var(--accent)}
.week-scroll{overflow-x:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));gap:8px;min-width:920px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;display:flex;flex-direction:column;gap:6px;min-height:160px}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day header{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.day header b{font-size:1.4rem}
.mini{border:1px solid var(--line);border-left:4px solid var(--off);border-radius:7px;background:var(--bg);padding:5px 7px;font-size:.82rem}
.mini[data-s="en_curso"]{border-left-color:var(--run)} .mini[data-s="completada"]{border-left-color:var(--ok)} .mini[data-s="incidencia"]{border-left-color:var(--bad)}
.mini b{display:block;font-weight:600}
.mini span{color:var(--muted);font-family:var(--f-mono);font-size:.74rem}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px}
.tbl th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.big{font-family:var(--f-display);font-size:1.25rem;font-weight:700;white-space:nowrap}
.secno{color:var(--accent-ink)}
.bar-cell{display:flex;align-items:center;gap:8px;min-width:120px}
.bar-cell .meter{flex:1;margin:0}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.who{font-size:.76rem;color:var(--muted)}
.wrap>*,.grid2,#view>div>*{min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.block{display:grid;gap:8px;min-width:0;align-content:start}
.block h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.04em;font-size:1.05rem;margin:6px 0 0}
.quality{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.q b{font-family:var(--f-display);font-size:1.6rem;display:block;font-variant-numeric:tabular-nums}
.q span{font-size:.82rem;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;text-align:center}
</style>
</head>

/* ---- lectura del CSV ---- */
function parseCSV(text){
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){ if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ","){ row.push(f); f = ""; }
    else if (c === "\n"){ row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f !== "" || row.length){ row.push(f); rows.push(row); }
  return rows;
}
const COLS = {fecha:["fecha"], inicio:["inicio","hora inicio"], fin:["fin","hora fin"], titulo:["actividad"], tipo:["tipo"],
  lugar:["colonia lugar","colonia"], seccion:["seccion"], responsable:["responsable"], estatus:["estatus","status"],
  meta:["meta"], avance:["avance"], nota:["nota incidencia","nota"], actualizo:["actualizo"],
  sfecha:["sist fecha"], sini:["sist inicio"], sfin:["sist fin"]};
const num = v => { const s = String(v||"").replace(/[^\d.\-]/g,""); return s === "" ? null : Number(s); };
function serialToISO(n){ const d = new Date(Date.UTC(1899,11,30) + Math.round(n)*86400000); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()); }
function textDate(s){
  s = String(s||"").trim(); let m;
  if ((m = s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);
  if ((m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){ let y = Number(m[3]); if (y < 100) y += 2000; return y+"-"+pad(m[2])+"-"+pad(m[1]); }
  return "";
}
const minToHM = n => n == null || isNaN(n) ? "" : pad(Math.floor(n/60)%24)+":"+pad(n%60);
function textTime(s){
  const m = String(s||"").toLowerCase().match(/(\d{1,2}):(\d{2})\s*([ap])?/); if (!m) return "";
  let h = Number(m[1]); if (m[3] === "p" && h < 12) h += 12; if (m[3] === "a" && h === 12) h = 0;
  return pad(h)+":"+m[2];
}
function estatusKey(s){ const n = norm(s); if (n.startsWith("en curso")) return "en_curso"; if (n.startsWith("complet")) return "completada"; if (n.startsWith("incid")) return "incidencia"; if (n.startsWith("cancel")) return "cancelada"; return "pendiente"; }
function toActs(rows){
  if (!rows.length) return [];
  const H = rows[0].map(norm), idx = {};
  for (const [k, names] of Object.entries(COLS)) idx[k] = H.findIndex(h => names.includes(h));
  const g = (r,k) => idx[k] >= 0 ? (r[idx[k]] ?? "").trim() : "";
  const out = [];
  for (const r of rows.slice(1)){
    const titulo = g(r,"titulo"); if (!titulo) continue;
    const sf = num(g(r,"sfecha"));
    const fecha = sf ? serialToISO(sf) : textDate(g(r,"fecha"));
    if (!fecha) continue;
    const si = num(g(r,"sini")), sfn = num(g(r,"sfin"));
    out.push({fecha, titulo, tipo:g(r,"tipo"), lugar:g(r,"lugar"), seccion:g(r,"seccion"), responsable:g(r,"responsable"),
      inicio: si != null ? minToHM(si) : textTime(g(r,"inicio")), fin: sfn != null ? minToHM(sfn) : textTime(g(r,"fin")),
      estatus: estatusKey(g(r,"estatus")), meta: num(g(r,"meta")), avance: num(g(r,"avance")) || 0, nota: g(r,"nota"), actualizo: g(r,"actualizo")});
  }
  return out;
}

const state = {view:"metricas", fecha: iso(new Date()), acts:[], demo:false};
const isLate = a => a.estatus === "pendiente" && (a.fecha < iso(new Date()) || (a.fecha === iso(new Date()) && !!a.inicio && a.inicio < nowHM()));
const byTime = (x,y) => (x.inicio||"99").localeCompare(y.inicio||"99") || x.titulo.localeCompare(y.titulo);
const secSort = (x,y) => (x==="Sin sección")-(y==="Sin sección") || (Number(x)-Number(y)) || x.localeCompare(y);

function kpis(list, label){
  const v = list.filter(a=>a.estatus!=="cancelada");
  const c = s => v.filter(a=>a.estatus===s).length;
  const late = v.filter(isLate).length, wm = v.filter(a=>a.meta>0);
  const meta = wm.reduce((s,a)=>s+a.meta,0), av = wm.reduce((s,a)=>s+Math.min(a.avance,a.meta),0), pct = meta ? Math.round(av/meta*100) : 0;
  $("#kpis").innerHTML = `
    <div class="kpi"><b>${v.length}</b><span>Actividades · ${esc(label)}</span></div>
    <div class="kpi"><b>${c("en_curso")}</b><span>En curso</span></div>
    <div class="kpi"><b>${c("completada")}/${v.length}</b><span>Completadas</span></div>
    <div class="kpi ${c("incidencia")+late?"alert":""}"><b>${c("incidencia")+late}</b><span>Incidencias · atrasos</span></div>
    <div class="kpi"><b>${pct}%</b><span>Avance de metas</span><div class="meter"><i style="width:${pct}%"></i></div></div>`;
}
function card(a){
  const late = isLate(a), pct = a.meta > 0 ? Math.min(100, Math.round(a.avance/a.meta*100)) : 0;
  return `<article class="act ${late?"late":""}" data-s="${a.estatus}">
    <div class="time">${esc(a.inicio||"—")}<small>${a.fin?"a "+esc(a.fin):"sin hora"}</small></div>
    <div><h3>${esc(a.titulo)} <span class="pill ${late?"late":""}" data-s="${a.estatus}">${late?"Atrasada":EST[a.estatus]}</span></h3>
    <div class="meta">${a.tipo?`<span class="tag">${esc(a.tipo)}</span>`:""}${/\d/.test(a.seccion||"")?`<span class="tag sec">Secc. ${esc(a.seccion)}</span>`:""}<span>${esc(a.lugar||"Colonia por definir")}</span><span>Resp.: <b>${esc(a.responsable||"Por asignar")}</b></span></div>
    ${a.meta>0?`<div class="prog"><div class="meter"><i style="width:${pct}%"></i></div><output>${a.avance}/${a.meta}</output></div>`:""}
    ${MOSTRAR_NOTAS && a.nota?`<div class="note ${a.estatus==="incidencia"?"bad":""}">${esc(a.nota)}</div>`:""}
    </div></article>`;
}
function viewHoy(){
  const list = state.acts.filter(a=>a.fecha===state.fecha).sort(byTime), today = state.fecha === iso(new Date());
  kpis(list, fmtDay(state.fecha));
  if (!list.length) return `<div class="empty">No hay actividades registradas para ${esc(fmtDay(state.fecha))}.</div>`;
  let h = `<div class="timeline">`, placed = !today; const now = nowHM();
  for (const a of list){ if (!placed && a.inicio && a.inicio > now){ h += `<div class="now-line">AHORA ${now}</div>`; placed = true; } h += card(a); }
  if (!placed) h += `<div class="now-line">AHORA ${now}</div>`;
  return h + `</div>`;
}
function weekActs(){ const s = monday(state.fecha), e = addDays(s,6); return state.acts.filter(a=>a.fecha>=s && a.fecha<=e); }
function viewSemana(){
  const s = monday(state.fecha), today = iso(new Date()); kpis(weekActs(), "semana");
  let h = `<div class="week-scroll"><div class="week">`;
  for (let i=0;i<7;i++){
    const f = addDays(s,i), d = parseISO(f), L = state.acts.filter(a=>a.fecha===f).sort(byTime);
    h += `<div class="day ${f===today?"today":""}"><header><span>${DIAS[d.getDay()]}</span><b>${d.getDate()}</b></header>` +
      (L.length ? L.map(a=>`<div class="mini" data-s="${isLate(a)?"pendiente":a.estatus}"><span>${esc(a.inicio||"s/h")}${/\d/.test(a.seccion||"")?" · Secc. "+esc(a.seccion):""}</span><b>${esc(a.titulo)}</b><span>${esc(a.responsable||"Por asignar")} · ${isLate(a)?"Atrasada":EST[a.estatus]}</span></div>`).join("") : `<span class="who">Sin actividades</span>`) + `</div>`;
  }
  return h + `</div></div>`;
}
function grouped(keyFn, list){
  const m = {};
  for (const a of (list || weekActs())){ if (a.estatus==="cancelada") continue; const k = keyFn(a); const o = (m[k] ||= {n:0,h:0,c:0,p:0,i:0,late:0,meta:0,av:0,cols:new Set()});
    o.n++; if (a.estatus==="completada") o.h++; else if (a.estatus==="en_curso") o.c++; else if (a.estatus==="incidencia") o.i++; else { o.p++; if (isLate(a)) o.late++; }
    if (a.meta>0){ o.meta+=a.meta; o.av+=Math.min(a.avance,a.meta); } if (a.lugar) o.cols.add(a.lugar); }
  return m;
}

}
function viewSecciones(){
  kpis(weekActs(), "semana");
  const m = grouped(a=>/\d/.test(a.seccion||"")?a.seccion:"Sin sección"), keys = Object.keys(m).sort(secSort);
  if (!keys.length) return `<div class="empty">Sin actividades esta semana.</div>`;
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Sección</th><th>Colonias</th><th>Actividades</th><th>Hechas</th><th>Avance de metas</th></tr></thead><tbody>` +
    keys.map(k=>{ const o = m[k]; return `<tr><td class="big secno">${esc(k)}</td><td>${[...o.cols].sort().map(esc).join(", ")||"—"}</td><td class="n">${o.n}</td><td class="n">${o.h}</td><td>${o.meta?pctBar(o.av/o.meta):'<span class="who">Sin meta</span>'}</td></tr>`; }).join("") + `</tbody></table></div>`;
}
/* ---- métricas de todo el periodo ---- */
function periodo(){
  const f = state.acts.map(a=>a.fecha).filter(Boolean).sort();
  return f.length ? "del " + fmtDay(f[0]) + " al " + fmtDay(f[f.length-1]) : "";
}
function tablaGrupo(m, label, sortFn){
  const keys = Object.keys(m).sort(sortFn || ((x,y)=>m[y].n-m[x].n));
  if (!keys.length) return `<div class="empty">Sin datos.</div>`;
  return `<div class="tbl-wrap"><table class="tbl" style="min-width:420px"><thead><tr><th>${label}</th><th>Prog.</th><th>Hechas</th><th>Vencidas</th><th>Cumplimiento</th></tr></thead><tbody>` +
    keys.map(k=>{ const o = m[k]; return `<tr><td><b>${esc(k)}</b></td><td class="n">${o.n}</td><td class="n">${o.h}</td><td class="n">${o.late}</td><td>${pctBar(o.n?o.h/o.n:0)}</td></tr>`; }).join("") + `</tbody></table></div>`;
}
function viewMetricas(){
  const all = state.acts;
  kpis(all, "calendarizadas");
  const sem = grouped(a=>a.fecha?monday(a.fecha):"", all);
  const semRows = Object.keys(sem).sort().reverse();
  let h = `<div class="block"><h3>Cumplimiento por semana</h3><div class="tbl-wrap"><table class="tbl" style="min-width:460px"><thead><tr><th>Semana</th><th>Prog.</th><th>Hechas</th><th>En curso</th><th>Vencidas</th><th>Cumplimiento</th></tr></thead><tbody>` +
    semRows.map(k=>{ const o = sem[k]; return `<tr><td><b>Semana del ${esc(fmtDay(k))}</b></td><td class="n">${o.n}</td><td class="n">${o.h}</td><td class="n">${o.c}</td><td class="n">${o.late}</td><td>${pctBar(o.n?o.h/o.n:0)}</td></tr>`; }).join("") +
    `</tbody></table></div></div>`;
  h += `<div class="grid2">
    <div class="block"><h3>Por tipo de actividad</h3>${tablaGrupo(grouped(a=>a.tipo||"Otro", all), "Tipo")}</div>
    <div class="block"><h3>Por responsable</h3>${tablaGrupo(grouped(a=>(a.responsable||"Por asignar").toUpperCase(), all), "Responsable")}</div>
  </div>`;
  const vivos = all.filter(a=>a.estatus!=="cancelada");
  const sinAv = vivos.filter(a=>a.estatus==="completada" && a.meta>0 && !a.avance).length;
  const sinSec = vivos.filter(a=>!/\d/.test(a.seccion||"")).length;
  const sinCol = vivos.filter(a=>!a.lugar || /^(por definir|na|n|n\/a|-)$/i.test(a.lugar.trim())).length;
  const sinResp = vivos.filter(a=>!a.responsable).length;
  h += `<div class="block"><h3>Calidad del registro</h3><div class="quality">
    <div class="q"><b>${sinAv}</b><span>Completadas con meta pero sin avance capturado</span></div>
    <div class="q"><b>${sinSec}</b><span>Actividades sin sección electoral</span></div>
    <div class="q"><b>${sinCol}</b><span>Actividades sin colonia o lugar</span></div>
    <div class="q"><b>${sinResp}</b><span>Actividades sin responsable</span></div>
  </div></div>`;
  return `<div style="display:grid;gap:16px">${h}</div>`;
}
function render(){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.view===state.view)));
  const wk = state.view !== "hoy";
  document.querySelector(".nav").hidden = state.view === "metricas";
  $("#navlabel").textContent = wk ? "Sem. " + fmtDay(monday(state.fecha)) : fmtDay(state.fecha);
  $("#view").innerHTML = `<div class="sec-h"><h2>${{metricas:"Métricas de todas las actividades",hoy:"Agenda del día",semana:"Semana",equipo:"Cumplimiento por responsable",secciones:"Trabajo por sección"}[state.view]}</h2><small>${state.view==="metricas"?periodo():wk?"semana del "+esc(fmtDay(monday(state.fecha))):""}</small></div>` +
    ({metricas:viewMetricas, hoy:viewHoy, semana:viewSemana, equipo:viewEquipo, secciones:viewSecciones})[state.view]();
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{ state.view=b.dataset.view; render(); });
$("#prev").onclick = ()=>{ state.fecha = addDays(state.fecha, state.view==="hoy"?-1:-7); render(); };
$("#next").onclick = ()=>{ state.fecha = addDays(state.fecha, state.view==="hoy"?1:7); render(); };
$("#hoyBtn").onclick = ()=>{ state.fecha = iso(new Date()); render(); };

/* ---- carga ---- */
const url = new URLSearchParams(location.search).get("csv") || CSV_URL;
function setStatus(cls, txt){ $("#dot").className = "dot " + cls; $("#dotTxt").textContent = txt; }
async function load(){
  if (SNAPSHOT){
    state.acts = SNAPSHOT; setStatus("on","Corte de datos");
    $("#stamp").textContent = SNAPSHOT_AT ? "Datos al " + SNAPSHOT_AT : "";
    $("#foot").textContent = "Página de consulta del equipo HQ. Muestra las actividades registradas en la agenda del equipo hasta la fecha del corte.";
    render(); return;
  }
  if (!url){
    state.acts = demo(); state.demo = true; setStatus("demo","Ejemplo");
    $("#banner").hidden = false;
    $("#banner").innerHTML = "<b>Datos de ejemplo.</b> Para ver la agenda real, publica la hoja <b>Agenda</b> de Google Sheets como CSV y pega el enlace en <code>CSV_URL</code> dentro de este archivo.";
    render(); return;
  }
  try {
    const r = await fetch(url + (url.includes("?")?"&":"?") + "_=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const acts = toActs(parseCSV(await r.text()));
    state.acts = acts; $("#banner").hidden = true;
    setStatus("on","Actualizado");
    $("#stamp").textContent = "Leído a las " + new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
  } catch(e){
    setStatus("","Sin conexión");
    $("#banner").hidden = false;
    $("#banner").textContent = state.acts.length ? "No se pudo actualizar. Se muestran los últimos datos leídos." : "No se pudo leer la agenda. Revisa que la hoja siga publicada en la Web como CSV.";
  }
  render();
}
load();
if (!SNAPSHOT) setInterval(load, REFRESCO_MIN*60000);
setInterval(()=>{ if (state.view==="hoy") render(); }, 60000);
</script>
</body>
</html>
